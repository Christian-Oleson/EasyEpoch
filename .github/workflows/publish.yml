name: Publish to npm

# Release automation, entirely through npm Trusted Publishing (OIDC - no
# stored npm token) from this single workflow file. npm allows exactly one
# trusted publisher per package, matched on the workflow *filename*, so every
# publishing path for both packages has to live in publish.yml.
#
#   push to main      -> if package.json's version is not released yet:
#                        create tag vX.Y.Z + a GitHub release (notes taken
#                        from CHANGELOG.md), then `npm stage publish`
#                        easyepoch with provenance. A maintainer finishes it
#                        with `npm stage approve <id>` (2FA prompt). Merges
#                        that do not bump the version publish nothing.
#   pull_request      -> publish easyepoch-preview@X.Y.Z-pr<N>.<run>.g<sha>
#                        directly (no approval) under dist-tag pr-<N>, and
#                        post/update the install command on the PR. Skipped
#                        for forks and Dependabot, which cannot obtain an
#                        OIDC token.
#   workflow_dispatch -> re-stage a release (e.g. after `npm stage reject`),
#                        or stage a next / beta / rc prerelease of any
#                        branch (approval required, like a release).
#
# Why previews are a separate package: a trusted publisher's "Allow npm
# publish" switch is package-wide. easyepoch keeps it OFF so nothing can be
# published without a human; easyepoch-preview has it ON so previews need no
# approval. Consumers alias it back to the real name, so imports don't change:
#   npm install easyepoch@npm:easyepoch-preview@pr-88
#
# One-time setup on npmjs.com (each package -> Settings):
#   Trusted Publishing -> GitHub Actions: owner Christian-Oleson, repository
#     EasyEpoch, workflow filename publish.yml, environment blank.
#   easyepoch:          Allowed actions -> "Allow npm publish" OFF (stage only).
#   easyepoch-preview:  Allowed actions -> "Allow npm publish" ON. A trusted
#     publisher can only be added to an existing package, so publish a stub
#     of easyepoch-preview once by hand first (see README "Releasing").
#   Publishing access: "Require two-factor authentication and disallow tokens".
# Staged + trusted publishing need npm >= 11.15, hence the npm upgrade steps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: >-
          "release" = re-stage package.json's version as latest (only if it is
          not on npm yet). next / beta / rc = stage a prerelease of the selected
          branch under that dist-tag.
        type: choice
        options: [release, next, beta, rc]
        default: release
      version:
        description: >-
          Prerelease channels only. Explicit version such as 2.1.0-beta.1; leave
          blank for <package.json version>-<channel>.<run number>.g<short sha>.
        type: string
        required: false

# Default minimal permissions. Publishing jobs widen what they need.
permissions:
  contents: read

# One preview publish per PR at a time (a newer push cancels the older run);
# release runs are never cancelled.
concurrency:
  group: publish-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Decide what to publish
    runs-on: ubuntu-latest
    # Forks and Dependabot run with a read-only token and cannot request the
    # OIDC id-token, so there is nothing they could publish; skip early.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      mode: ${{ steps.plan.outputs.mode }}
      package: ${{ steps.plan.outputs.package }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve package, version and dist-tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CHANNEL: ${{ inputs.channel }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$(node -p "require('./package.json').version")
          short=${HEAD_SHA:0:7}
          publish=true
          reason=""
          package=easyepoch

          case "$EVENT" in
            push)
              mode=release
              version="$base"
              tag=latest
              if git ls-remote --exit-code --tags origin "refs/tags/v$base" >/dev/null 2>&1; then
                publish=false
                reason="tag v$base already exists, so this release was already initiated (re-run via workflow_dispatch if it needs re-staging)"
              elif npm view "easyepoch@$base" version >/dev/null 2>&1; then
                publish=false
                reason="easyepoch@$base is already on npm"
              fi
              ;;
            pull_request)
              mode=preview
              package=easyepoch-preview
              tag="pr-$PR_NUMBER"
              version="${base}-pr${PR_NUMBER}.${GITHUB_RUN_NUMBER}.g${short}"
              ;;
            workflow_dispatch)
              if [ "$CHANNEL" = "release" ]; then
                mode=release
                version="$base"
                tag=latest
                if npm view "easyepoch@$base" version >/dev/null 2>&1; then
                  publish=false
                  reason="easyepoch@$base is already on npm"
                fi
              else
                mode=prerelease
                tag="$CHANNEL"
                version="${EXPLICIT_VERSION:-${base}-${tag}.${GITHUB_RUN_NUMBER}.g${short}}"
                case "$version" in
                  *-*) ;;
                  *) echo "::error::Prerelease version '$version' has no prerelease suffix; it would shadow a real release."; exit 1 ;;
                esac
              fi
              ;;
            *)
              echo "::error::Unexpected event '$EVENT'"; exit 1 ;;
          esac

          echo "mode=$mode package=$package version=$version tag=$tag publish=$publish${reason:+ ($reason)}"
          if [ "$publish" != "true" ]; then
            echo "::notice::Nothing to publish: $reason"
          fi
          {
            echo "publish=$publish"
            echo "mode=$mode"
            echo "package=$package"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches ci.yml. Node 20 dropped: vitest 5 requires ^22.12 and
        # jsdom 30 requires ^22.22.2 (Node 20 is EOL as of April 2026). The
        # published package declares no `engines`, so consumers are unaffected.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

  # easyepoch: releases (push to main / dispatch) and manual prereleases.
  # Always staged; a maintainer approves with 2FA.
  stage:
    name: Stage easyepoch@${{ needs.plan.outputs.version }}
    needs: [plan, test]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.package == 'easyepoch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the vX.Y.Z tag + GitHub release
      id-token: write # OIDC for trusted publishing and provenance
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.tag }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for staged + trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Prerelease versions exist only in this checkout; nothing is committed.
      - name: Set prerelease version in the workspace
        if: env.MODE == 'prerelease'
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Tag first, then stage: `plan` treats an existing tag as "release
      # already initiated", so a failed staging is retried via
      # workflow_dispatch (channel release) rather than by every later push.
      - name: Create tag and GitHub release
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; re-staging only."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            let notes = "";
            try {
              const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
              const heading = new RegExp("^## \\[?" + v.replace(/\./g, "\\.") + "\\]?(\\s|$)");
              const i = lines.findIndex(l => heading.test(l));
              if (i >= 0) {
                let j = i + 1;
                while (j < lines.length && !/^## /.test(lines[j])) j++;
                notes = lines.slice(i + 1, j).join("\n").trim();
              }
            } catch {}
            if (!notes) notes = `Release v${v}. See CHANGELOG.md for details.`;
            notes += "\n\n---\n_Published to npm via staged trusted publishing; the version becomes installable once a maintainer runs `npm stage approve`._\n";
            fs.writeFileSync("release-notes.md", notes);
          '
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
          echo "Created GitHub release v$VERSION"

      # prepack runs `npm run build` (rspack bundles + tsc declarations), so
      # what is staged is always built from the checked-out source. npm prints
      # "+ easyepoch@x.y.z (staged with id <uuid>)"; the build's own output
      # precedes it, so the id is picked out by pattern rather than by parsing
      # stdout as JSON.
      - name: Stage on npm
        id: stage
        run: |
          npm stage publish --provenance --access public --tag "$DIST_TAG" 2>&1 | tee stage-output.txt
          node -e '
            const fs = require("fs");
            const out = fs.readFileSync("stage-output.txt", "utf8");
            const m = out.match(/staged with id ([0-9a-f-]{36})/i) || out.match(/"stageId"\s*:\s*"([0-9a-f-]{36})"/i);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `stage_id=${m ? m[1] : ""}\n`);
          '

      - name: Write approval instructions to the job summary
        env:
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        run: |
          {
            echo "## easyepoch@${VERSION} is staged on npm (dist-tag \`${DIST_TAG}\`) - approval needed"
            echo
            echo "The tarball is uploaded with provenance but **not published**. A maintainer must approve it (2FA prompt):"
            echo
            echo '```bash'
            echo "npm install -g npm@latest        # needs npm >= 11.15"
            echo "npm stage list easyepoch         # confirm the staged version"
            if [ -n "$STAGE_ID" ]; then
              echo "npm stage approve ${STAGE_ID}"
            else
              echo "npm stage approve <stage-id>     # id from 'npm stage list'"
            fi
            echo '```'
            echo
            echo "After approval it installs with:"
            echo
            echo '```bash'
            echo "npm install easyepoch@${VERSION}"
            if [ "$DIST_TAG" != "latest" ]; then
              echo "npm install easyepoch@${DIST_TAG}    # tracks the newest ${DIST_TAG} prerelease"
            fi
            echo '```'
            echo
            echo "To discard it instead: \`npm stage reject <stage-id>\` (also required before re-staging the same version)."
          } >> "$GITHUB_STEP_SUMMARY"

  # easyepoch-preview: one directly-published build per PR push, no approval.
  preview:
    name: Publish easyepoch-preview@${{ needs.plan.outputs.version }}
    needs: [plan, test]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.package == 'easyepoch-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC for trusted publishing and provenance
      pull-requests: write # post the install command on the PR
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.tag }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Rename + re-version in the workspace only. repository.url stays the
      # real repo, so provenance still links the build to this commit.
      - name: Point package.json at easyepoch-preview
        run: |
          npm pkg set name=easyepoch-preview
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -p "require('./package.json').name + '@' + require('./package.json').version"

      # prepack builds dist/ from this PR's source before publishing.
      - name: Publish preview to npm
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Post install command on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- easyepoch-preview -->"
          short=${HEAD_SHA:0:7}
          body=$(cat <<EOF
          ${marker}
          ### Preview build published

          \`\`\`bash
          npm install easyepoch@npm:easyepoch-preview@${DIST_TAG}
          \`\`\`

          Exact build: \`easyepoch-preview@${VERSION}\` (commit ${short}), with provenance. The \`${DIST_TAG}\` dist-tag always points at the newest build for this PR. \`easyepoch@latest\` is untouched.
          EOF
          )
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
            echo "Updated preview comment ${existing}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            echo "Posted preview comment"
          fi
          {
            echo "## Preview published: easyepoch-preview@${VERSION}"
            echo
            echo '```bash'
            echo "npm install easyepoch@npm:easyepoch-preview@${DIST_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
