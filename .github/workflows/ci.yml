name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main]

# Default minimal permissions; jobs widen only as needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Full Node matrix on pull requests as well as on main. Each job takes
        # ~15 s and Actions minutes are free for public repositories, while the
        # "test (24)" check is required by the main branch ruleset - a PR-only
        # Node 22 run left that check permanently "expected", so pull requests
        # could never go green without an admin bypass.
        #
        # Node 20 was dropped when the test toolchain moved past it: vitest 5
        # requires ^22.12 and jsdom 30 requires ^22.22.2 (Node 20 itself went
        # end-of-life in April 2026). This is a dev-toolchain floor only - the
        # published package declares no `engines` and still ships ES2017
        # browser bundles, so consumers are unaffected.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

  # Browser smoke tests against the real built bundle. jsdom cannot evaluate
  # CSS, so focus management, pane visibility and genuine event dispatch are
  # only observable in a real browser.
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `test:e2e` runs the build first so the fixture loads current bundles.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # dist/ is committed (so `npm install github:...#branch` works) but is also
  # rebuilt by prepack at publish time. Without this check the two can drift:
  # a dependency bump that changes the bundler's output silently leaves the
  # committed bundles stale, and simply running `npm run build` locally dirties
  # the working tree. Fail the PR instead, so whoever bumps the dependency
  # commits the rebuilt bundles alongside it.
  verify-dist:
    name: dist is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Removes dist/ and rebuilds, then checks `git status` (not `git diff`,
      # which cannot see untracked or no-longer-emitted files).
      - name: Rebuild and check for drift
        run: npm run verify:dist

  # Installs the packed tarball into a throwaway project and exercises every
  # documented entry point. Without this, a broken `exports` map or a missing
  # ESM bundle passes every other check - which is exactly how 2.0.0 shipped
  # with `require('easyepoch')` returning an empty object.
  verify-package:
    name: packed package is consumable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Pack and verify consumption
        run: npm run verify:package
