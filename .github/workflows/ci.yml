name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main]

# Default minimal permissions; jobs widen only as needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Full Node matrix on pull requests as well as on main. Each job takes
        # ~15 s and Actions minutes are free for public repositories, while the
        # "test (24)" check is required by the main branch ruleset - a PR-only
        # Node 22 run left that check permanently "expected", so pull requests
        # could never go green without an admin bypass.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test
