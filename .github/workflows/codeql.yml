name: CodeQL

on:
  # Runs on pull requests so the required "Analyze (javascript-typescript)"
  # check can report - the main branch ruleset requires it, and a
  # schedule-only workflow left the check permanently "expected", so pull
  # requests could never go green without an admin bypass. Actions minutes
  # are free for public repositories, so the only cost is PR latency. The
  # weekly scan of main keeps code-scanning alerts on the default branch
  # current between releases.
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 14 * * 1' # Weekly on Monday
  workflow_dispatch:

# Default minimal permissions at the workflow level. The analyze job widens
# to security-events:write so it can upload SARIF results.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}

      # No Autobuild step: JavaScript/TypeScript is analyzed straight from
      # source, and skipping it shortens the run.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.0
        with:
          category: '/language:${{ matrix.language }}'
